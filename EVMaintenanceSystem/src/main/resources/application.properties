spring.application.name=EVMaintenanceSystem

# Server Configuration
server.port=8080

# SQL Server Configuration - SQL EXPRESS on port 1433
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EVMSystem;encrypt=true;trustServerCertificate=true;useUnicode=true;characterEncoding=utf-8;characterSetResults=utf8mb4;sendTimeAsDatetime=false
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=30000
